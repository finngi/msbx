name: Docs

# Pull requests only build the book; pushes to main build and deploy it to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Not named MDBOOK_*: mdBook reads every MDBOOK_* variable as a book.toml override.
  # mdbook-mermaid 0.17.1 is built against mdbook 0.5.0; matching them avoids a version warning.
  DOCS_MDBOOK_VERSION: 0.5.0
  DOCS_MERMAID_VERSION: 0.17.1

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read # configure-pages reads the repository's Pages settings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Downloads the pinned release binaries and verifies their SHA-256 checksums.
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@${{ env.DOCS_MDBOOK_VERSION }},mdbook-mermaid@${{ env.DOCS_MERMAID_VERSION }}
      # Writes mermaid.min.js and mermaid-init.js (git-ignored) for the pinned mdbook-mermaid.
      - run: mdbook-mermaid install docs
      - run: mdbook build docs
      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

  deploy:
    name: deploy
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # to create the Pages deployment
      id-token: write # to prove the deployment comes from this workflow
    # One deployment at a time; never cancel one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
