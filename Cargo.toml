[package]
name = "msbx"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An sbx-style TUI and agent launcher for microsandbox microVMs"
license = "Apache-2.0"
repository = "https://github.com/finngi/msbx"
readme = "README.md"
keywords = ["microsandbox", "sandbox", "tui", "microvm", "agents"]
categories = ["command-line-utilities", "virtualization"]

[dependencies]
anyhow = "1"
# Already in the lock through microsandbox; named directly to decode `Proxy-Authorization: Basic`.
base64 = "=0.23.1"
# Already in the lock through microsandbox; `clock` gives local wall-clock times for the Network tab.
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
microsandbox = { version = "=0.7.11", default-features = false, features = ["local", "net"] }
# Already a dependency of microsandbox; named directly because the SDK does not re-export the
# network-policy types (`Destination`, `DestinationGroup`) needed to summarise a policy.
microsandbox-types = "=0.7.11"
ratatui = "0.30"
# Policy file and connection log (RFC 0002 chose TOML + serde).
serde = { version = "=1.0.229", features = ["derive"] }
# Already in the lock through microsandbox; named directly for pi's models.json transform.
serde_json = "=1.0.154"
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "=1.1.8"

[dev-dependencies]
insta = "1.49"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
dbg_macro = "warn"
exit = "warn"
get_unwrap = "warn"
unwrap_used = "warn"
print_stdout = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
